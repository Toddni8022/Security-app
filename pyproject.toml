[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-app"
version = "1.0.0"
description = "Windows security scanner and remediation toolkit with Flask API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Toddni8022" }]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22,<23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://github.com/Toddni8022/Security-app"
Repository = "https://github.com/Toddni8022/Security-app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=security_app --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S101", "S603", "S602"]

[tool.bandit]
targets = ["src"]
skips = ["B101", "B603", "B602"]
