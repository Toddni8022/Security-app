<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Robot</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
            font-size: 100px;
            transition: transform 0.2s;
        }
        .dancing {
            animation: dance 0.5s infinite alternate;
        }
        @keyframes dance {
            0% { transform: translate(0); }
            50% { transform: translate(-10px, -10px); }
            100% { transform: translate(10px, 10px); }
        }
    </style>
</head>
<body>
    <div class="dancing">🤖</div>
    <script>
        // Simple script to add dancing effect
        const robot = document.querySelector('.dancing');
        setInterval(() => {
            robot.classList.toggle('dancing');
        }, 1000);
    </script>
</body>
</html>
